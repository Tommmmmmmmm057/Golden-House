        <div>
            <h1 class="cinzel">OUR MENU</h1>
            <div class="slider-container">
                <!-- Control Arrows -->
                <button class="slider-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
                <button class="slider-btn next-btn" onclick="moveSlide(1)">&#10095;</button>

                <!-- Slides Wrapper -->
                <div class="slider-track" id="sliderTrack">
                    
                    <!-- Slide 1 -->
                    <div class="slide">
                        <img src="sample.jpg" alt="ProjectXdonate Image 3" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80'">
                    </div>


                    <!-- Slide 2 -->
                    <div class="slide">
                        <img src="sample.jpg" alt="ProjectXdonate Image 3" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80'">
                    </div>


                    <!-- Slide 3 -->
                    <div class="slide">
                        <img src="sample.jpg" alt="ProjectXdonate Image 3" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80'">
                    </div>

                    <!-- Slide 4 -->
                    <div class="slide">
                        <img src="sample.jpg" alt="ProjectXdonate Image 3" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80'">
                    </div>


                    <!-- Slide 5 -->
                    <div class="slide">
                        <img src="sample.jpg" alt="ProjectXdonate Image 3" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80'">
                    </div>

                    <!-- Slide 6 -->
                    <div class="slide">
                        <img src="sample.jpg" alt="ProjectXdonate Image 3" onerror="this.src='https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=800&q=80'">
                    </div>

                </div>
            </div>

            <!-- Pagination Dots -->
            <div class="slider-dots" id="sliderDots"></div>
                <script>
                    const track = document.getElementById('sliderTrack');
                    const slides = document.querySelectorAll('.slide');
                    const dotsContainer = document.getElementById('sliderDots');
                    
                    let currentIndex = 0;
                    const totalSlides = slides.length;

                    // Create dots dynamically based on the number of slides
                    for (let i = 0; i < totalSlides; i++) {
                        const dot = document.createElement('button');
                        dot.classList.add('dot');
                        if (i === 0) dot.classList.add('active');
                        dot.setAttribute('onclick', `currentSlide(${i})`);
                        dotsContainer.appendChild(dot);
                    }

                    const dots = document.querySelectorAll('.dot');

                    function updateSlider() {
                        track.style.transform = `translateX(-${currentIndex * 100}%)`;
                        
                        // Update active dot
                        dots.forEach((dot, index) => {
                            dot.classList.toggle('active', index === currentIndex);
                        });
                    }

                    function moveSlide(direction) {
                        currentIndex += direction;
                        if (currentIndex < 0) {
                            currentIndex = totalSlides - 1;
                        } else if (currentIndex >= totalSlides) {
                            currentIndex = 0;
                        }
                        updateSlider();
                    }

                    function currentSlide(index) {
                        currentIndex = index;
                        updateSlider();
                    }

                    // Optional: Auto slide every 5 seconds
                    setInterval(() => {
                        moveSlide(1);
                    }, 5000);
                </script>
                <div id="button-container">
                    <a id="button" href="####">MENU</a>
